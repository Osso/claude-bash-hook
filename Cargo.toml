[package]
name = "claude-bash-hook"
version = "0.2.1"
edition = "2024"
autobins = false

[dependencies]
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob-match = "0.2"
nu-parser = "=0.109.1"
nu-protocol = "=0.109.1"
nu-engine = "=0.109.1"
log = "0.4"
systemd-journal-logger = "2"
regex = "1.12.2"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util"] }
rmcp = { version = "0.9", features = ["server", "transport-io", "elicitation"] }
schemars = "1"
anyhow = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = false

strip = true

[[bin]]
name = "claude-bash-hook"
path = "src/main.rs"

[[bin]]
name = "claude-bash-hook-approval"
path = "src/bin/approval_prompt.rs"

[[bin]]
name = "debug"
path = "src/bin/debug.rs"

[[bin]]
name = "debug_env"
path = "src/bin/debug_env.rs"
