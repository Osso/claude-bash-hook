[package]
name = "claude-bash-hook"
version = "0.2.1"
edition = "2024"

[dependencies]
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob-match = "0.2"
nu-parser = "=0.109.1"
nu-protocol = "=0.109.1"
nu-engine = "=0.109.1"
log = "0.4"
systemd-journal-logger = "2"
regex = "1.12.2"
llm-sdk = { path = "/home/osso/Projects/lib/llm-sdk" }
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = false
incremental = true
strip = true
